name: AI AppSec Fix

# Fired by the Jira Automation rule (docs/jira-automation-rule.md) via
# repository_dispatch, or manually for testing with workflow_dispatch.
#
# This workflow lives in V1X (the "brain" — orchestrator + CLAUDE.md +
# security/knowledge) and is CENTRALIZED: the target repo to fix is named
# in the Jira ticket's payload (client_payload.repo), checked out as a
# second path, and patched/pushed there. V1X itself is never written to —
# this job only ever reads from it. See docs/jira-automation-rule.md for
# why this design was chosen over putting a copy of this workflow in every
# target repo.
#
# NOT included yet: the CodeRabbit review-reply loop. That needs something
# listening on the TARGET repo (since PR review comments happen there, and
# GitHub Actions triggers are repo-scoped) — deferred on purpose for now.
#
# The webhook body only carries the issue key + target repo; summary and
# description are fetched live from the Jira REST API below (see
# docs/jira-automation-rule.md for why — short version: Jira Automation's
# JSON body editor chokes on free text containing quotes/newlines).
on:
  repository_dispatch:
    types: [trigger_ai_fix]
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Jira issue key, e.g. VD-1"
        required: true
      repo:
        description: "Target repo to fix, as owner/name"
        required: false
        default: "Andrelleite/juice-shop"

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      # `secrets.X` can't be referenced directly inside a step's `if:` —
      # GitHub Actions only allows the secrets context in env:/with:/run:,
      # not if: (parse error: "Unrecognized named-value: 'secrets'"). Stash
      # it in a job-level env var first, then check THAT in if: instead.
      HAS_CLAUDE_SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_CREDS != '' }}
    steps:
      - name: Checkout V1X (this repo — the "brain", read-only)
        uses: actions/checkout@v4

      - name: Checkout the target repo named in the Jira ticket
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo || inputs.repo }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ticket details from Jira and build payload file
        # The webhook body only ever carries the issue key + target repo —
        # both always safe to embed in Jira's smart-value JSON (an issue
        # key like "VD-3" has no characters that need escaping). Free text
        # (summary/description) is fetched here via the Jira REST API
        # instead of being passed through the webhook body, which sidesteps
        # Jira Automation's JSON-escaping quirks for arbitrary text entirely
        # and always reads the ticket's current text, not a stale snapshot
        # from whenever the webhook fired.
        env:
          ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
          TARGET_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          curl -sf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "https://vixai.atlassian.net/rest/api/2/issue/$ISSUE_KEY?fields=summary,description" \
            -o jira_issue.json
          python3 - <<'PY'
          import json, os
          issue = json.load(open("jira_issue.json"))
          fields = issue.get("fields", {})
          payload = {
              "issue_key": os.environ["ISSUE_KEY"],
              "summary": fields.get("summary") or "",
              "description": fields.get("description") or "",
              "labels": ["sec-ai-fix"],
              "repo": os.environ["TARGET_REPO"],
          }
          with open("jira_payload.json", "w") as f:
              json.dump(payload, f)
          PY

      - name: Copy brain context into the target checkout (never committed)
        # CLAUDE.md/GEMINI.md/security/ have to physically be inside the
        # target checkout for the agent to read them (its filesystem access
        # is sandboxed to its own cwd). target/.git/info/exclude is a
        # LOCAL-only ignore list — never committed — so no matter how the
        # agent stages its fix commit, these brain files can never leak into
        # the actual PR diff on the target repo.
        run: |
          cp CLAUDE.md target/
          cp GEMINI.md target/
          cp -r security target/
          printf 'CLAUDE.md\nGEMINI.md\nsecurity/\n' >> target/.git/info/exclude

      - name: Configure git identity in the target checkout
        working-directory: target
        run: |
          git config user.name "AI AppSec Bot"
          git config user.email "ai-appsec-bot@users.noreply.github.com"

      - name: Install Gemini CLI and Claude Code
        # Gemini is tried first (cost reasons), Claude Code is the fallback
        # — see orchestrator/runners.py. Installing both means the fallback
        # actually works even if Gemini errors out mid-run.
        run: |
          npm install -g @google/gemini-cli
          npm install -g @anthropic-ai/claude-code

      - name: Restore Claude Code subscription session (optional fallback auth)
        # Only used if ANTHROPIC_API_KEY isn't set — lets the Claude
        # fallback run on a Pro/Max subscription instead of billed API
        # credits. See docs/claude-subscription-fallback.md for how this
        # secret is produced and its risk tradeoffs before relying on it.
        if: ${{ env.HAS_CLAUDE_SUBSCRIPTION == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_CREDS: ${{ secrets.CLAUDE_CODE_OAUTH_CREDS }}
        run: |
          mkdir -p "$HOME/.claude"
          printf '%s' "$CLAUDE_CODE_OAUTH_CREDS" > "$HOME/.claude/.credentials.json"
          chmod 600 "$HOME/.claude/.credentials.json"

      - name: Create branch in the target repo
        working-directory: target
        run: |
          git checkout -b "fix/ai-$(python3 -c "import json;print(json.load(open('../jira_payload.json'))['issue_key'])")"

      - name: Run the Fixer against the target checkout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m orchestrator.cli fix --payload jira_payload.json --repo-dir target --execute

      - name: Push branch and open PR on the target repo
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          ISSUE_KEY=$(python3 -c "import json;print(json.load(open('../jira_payload.json'))['issue_key'])")
          git push origin HEAD
          gh pr create \
            --title "[$ISSUE_KEY] AI Automated Fix" \
            --body "Automated remediation for Jira ticket $ISSUE_KEY. See CLAUDE.md (from Andrelleite/V1X) for the process that produced this PR." \
            --fill
